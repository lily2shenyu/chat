name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js assets manifest.json sw.js icons android/app/src/main/assets/www/

      - name: Generate launcher icons
        run: |
          cd android/app/src/main/res
          mkdir -p mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${entry%%:*}"
            size="${entry##*:}"
            convert "$GITHUB_WORKSPACE/icons/icon-512.png" -resize "${size}x${size}" "mipmap-${d}/ic_launcher.png"
          done

      - name: Build APK
        run: |
          export PATH="$GITHUB_WORKSPACE/gradle-8.7/bin:$PATH"
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lilidreamlove-apk
          path: android/app/build/outputs/apk/debug/*.apk
