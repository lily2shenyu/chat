name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (preinstalled)
        run: |
          echo "SDK=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1); fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: love-keystore-v1

      - name: Ensure signing keystore
        run: |
          mkdir -p android/keystore
          if [ ! -f android/keystore/love.keystore ]; then
            keytool -genkeypair -v -keystore android/keystore/love.keystore -alias lilidreamlove -keyalg RSA -keysize 2048 -validity 10000 -storepass lilidreamlove -keypass lilidreamlove -dname "CN=LOVE, OU=lili, O=shenyu, L=city, S=state, C=CN"
          fi

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js images manifest.json sw.js icons android/app/src/main/assets/www/

      - name: Build APK
        run: |
          export PATH="$GITHUB_WORKSPACE/gradle-8.7/bin:$PATH"
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lilidreamlove-apk
          path: android/app/build/outputs/apk/debug/*.apk
